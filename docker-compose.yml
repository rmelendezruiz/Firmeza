services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: firmeza
      POSTGRES_USER: firmeza
      POSTGRES_PASSWORD: firmeza
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firmeza -d firmeza"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - firmeza-db:/var/lib/postgresql/data
    networks:
      - interna

  staff:
    build:
      context: .
      dockerfile: src/Firmeza.Staff/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Firmeza: Host=postgres;Port=5432;Database=firmeza;Username=firmeza;Password=firmeza
      InitialAdmin__Email: admin@firmeza.local
      InitialAdmin__Password: Admin123!
      TrustedProxy__Network: 172.28.0.0/24
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna

  site:
    build:
      context: .
      dockerfile: src/Firmeza.Site/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Firmeza: Host=postgres;Port=5432;Database=firmeza;Username=firmeza;Password=firmeza
      TrustedProxy__Network: 172.28.0.0/24
    depends_on:
      staff:
        condition: service_started
    networks:
      - interna

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - site
      - staff
    networks:
      - interna

networks:
  interna:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  firmeza-db:
